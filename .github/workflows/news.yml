# News automatiche per il sito di CF Consulting.
#
# Lunedi' e giovedi' mattina pubblica DUE notizie nuove, senza approvazione
# (decisione della call del 30/10/2026): le scrive in src/news e le salva
# in un unico salvataggio, quindi Netlify ricostruisce una volta sola per
# giro (15 crediti, circa 9 volte al mese). Le news restano online due mesi.
# Il lunedi' controlla anche le condizioni d'uso delle fonti e le
# scadenze delle certificazioni.
#
# Gli orari sono in UTC: le 6:00 UTC sono le 8:00 d'estate e le 7:00
# d'inverno in Italia. GitHub puo' partire con qualche minuto di ritardo.
#
# Da sapere: su un repository pubblico GitHub sospende gli avvii
# programmati dopo 60 giorni senza nessuna modifica al repository.
# Ogni notizia o progetto pubblicato conta come modifica, quindi con
# un uso normale del pannello non succede; se succede, GitHub avvisa
# per email e basta riattivarlo dalla scheda Actions.

name: News automatiche

on:
  schedule:
    - cron: '0 6 * * 1'   # lunedi': sorveglianza + raccolta
    - cron: '0 6 * * 4'   # giovedi': solo raccolta
  workflow_dispatch:       # avvio a mano dalla scheda Actions

permissions:
  contents: write          # salvare le news e lo stato della sorveglianza
  issues: write            # segnalare un cambio di condizioni o una scadenza

concurrency:
  group: news-automatiche
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Prima la sorveglianza: se una fonte cambia condizioni la spegne,
      # e la raccolta qui sotto non la usa piu'.
      - name: Sorveglianza delle condizioni d'uso
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: node strumenti/sorveglia-fonti.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scadenze delle certificazioni
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: node strumenti/scadenze-certificati.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblicazione delle news
        run: node strumenti/raccogli-news.mjs --scrivi

      # Un solo salvataggio per tutto: news nuove e stato della sorveglianza.
      # Se non e' cambiato niente non si salva niente e non si spende niente.
      - name: Salvataggio
        run: |
          git add src/news strumenti/sorveglianza-fonti.json src/fonti
          if git diff --cached --quiet; then
            echo "Niente di nuovo."
            exit 0
          fi
          git config user.name "Pubblicazione news"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "News del $(date -u +%F)"
          git pull --rebase --quiet
          git push --quiet
