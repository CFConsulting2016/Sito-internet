# News automatiche per il sito di CF Consulting.
#
# Lunedi' e giovedi' mattina propone fino a tre notizie nel pannello
# (scheda Workflow): il cliente sceglie quali pubblicare.
# Il lunedi' controlla anche le condizioni d'uso delle fonti e le
# scadenze delle certificazioni.
#
# Gli orari sono in UTC: le 6:00 UTC sono le 8:00 d'estate e le 7:00
# d'inverno in Italia. GitHub puo' partire con qualche minuto di ritardo.
#
# Da sapere: su un repository pubblico GitHub sospende gli avvii
# programmati dopo 60 giorni senza nessuna modifica al repository.
# Ogni notizia o progetto pubblicato conta come modifica, quindi con
# un uso normale del pannello non succede; se succede, GitHub avvisa
# per email e basta riattivarlo dalla scheda Actions.

name: News automatiche

on:
  schedule:
    - cron: '0 6 * * 1'   # lunedi': sorveglianza + raccolta
    - cron: '0 6 * * 4'   # giovedi': solo raccolta
  workflow_dispatch:       # avvio a mano dalla scheda Actions

permissions:
  contents: write          # salvare lo stato della sorveglianza
  pull-requests: write     # creare le proposte per il pannello
  issues: write            # segnalare un cambio di condizioni

concurrency:
  group: news-automatiche
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sorveglianza delle condizioni d'uso
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: node strumenti/sorveglia-fonti.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Si salva solo se e' cambiato qualcosa: nelle settimane tranquille
      # non arriva nessun salvataggio sul ramo principale.
      - name: Salvataggio dello stato della sorveglianza
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain strumenti/sorveglianza-fonti.json src/fonti)" ]; then
            git config user.name "Raccolta news"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add strumenti/sorveglianza-fonti.json src/fonti
            git commit -m "Sorveglianza fonti: controllo del $(date -u +%F)"
            git push
          fi

      # Il lunedi': segnala le certificazioni scadute o in scadenza
      - name: Scadenze delle certificazioni
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: node strumenti/scadenze-certificati.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Raccolta delle news
        run: node strumenti/raccogli-news.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
