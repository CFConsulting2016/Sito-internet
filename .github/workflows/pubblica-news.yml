# Pubblicazione settimanale delle news.
#
# Le news approvate nel pannello non ricostruiscono il sito una per una:
# ogni ricostruzione costa 15 crediti Netlify. Il lunedi' mattina questo
# giro controlla se ce ne sono in attesa e, solo in quel caso, avvia una
# ricostruzione unica. Le news con «Pubblicazione immediata» accesa escono
# subito e non aspettano il lunedi'.
#
# 7:00 UTC sono le 8:00 d'inverno e le 9:00 d'estate in Italia.
# Serve il secret NETLIFY_BUILD_HOOK: l'indirizzo del pulsante di avvio
# creato su Netlify (Project configuration > Build & deploy > Build hooks).

name: Pubblicazione news del lunedi

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:       # avvio a mano dalla scheda Actions

permissions:
  contents: read

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300   # serve la storia per capire cosa e' gia' online

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: News in attesa
        run: node strumenti/news-settimanali.mjs --avvia
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
