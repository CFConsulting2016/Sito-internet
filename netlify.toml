# Configurazione di pubblicazione per Netlify.
#
# Il generatore va eseguito a ogni pubblicazione, non solo in locale:
# Decap CMS scrive in src/, e senza una ricostruzione le pagine HTML
# resterebbero quelle vecchie. E' il motivo per cui qui c'e' un comando
# di build invece del semplice "pubblica quello che trovi".

[build]
  command = "node build.mjs"
  publish = "."
  # Decide se un salvataggio ricostruisce il sito (ogni costruzione costa
  # 15 crediti): niente per .github/ e strumenti/, le news aspettano il
  # giro del lunedi' salvo «Pubblicazione immediata», tutto il resto subito.
  # Regole in strumenti/pubblicazione.mjs; nel dubbio si costruisce.
  ignore = "node strumenti/salta-build.mjs"

[build.environment]
  # Fissata di proposito: un aggiornamento automatico della versione
  # di Node potrebbe cambiare il comportamento del generatore senza
  # che nessuno abbia toccato una riga.
  NODE_VERSION = "22"

# Le pagine sono statiche e cambiano a ogni pubblicazione: non vanno
# tenute in cache dal browser, altrimenti il cliente modifica un
# progetto e non vede la differenza.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le immagini invece non cambiano mai: hanno un nome diverso quando
# sono diverse, quindi possono restare in cache a lungo.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Il pannello di gestione non deve finire nei motori di ricerca.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# --- SOLO PRIMA DEL LANCIO ---------------------------------
# Finché il sito vive sull'indirizzo .netlify.app non deve finire nei
# motori di ricerca: sarebbe un doppione del sito attuale del cliente,
# e capita che il doppione si posizioni al posto dell'originale.
#
# AL LANCIO QUESTO BLOCCO VA TOLTO, altrimenti il sito resta invisibile
# a Google. Il generatore avvisa a ogni ricostruzione finché c'è.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
