# Configurazione di pubblicazione per Netlify.
#
# Il generatore va eseguito a ogni pubblicazione, non solo in locale:
# Decap CMS scrive in src/, e senza una ricostruzione le pagine HTML
# resterebbero quelle vecchie. E' il motivo per cui qui c'e' un comando
# di build invece del semplice "pubblica quello che trovi".

[build]
  command = "node build.mjs"
  publish = "."
  # Decide se un salvataggio ricostruisce il sito (ogni costruzione costa
  # 15 crediti): niente per .github/ e strumenti/, le news aspettano il
  # giro del lunedi' salvo «Pubblicazione immediata», tutto il resto subito.
  # Regole in strumenti/pubblicazione.mjs; nel dubbio si costruisce.
  ignore = "node strumenti/salta-build.mjs"

[build.environment]
  # Fissata di proposito: un aggiornamento automatico della versione
  # di Node potrebbe cambiare il comportamento del generatore senza
  # che nessuno abbia toccato una riga.
  NODE_VERSION = "22"

# Protezioni di base per tutte le pagine: il browser non indovina il tipo
# dei file, il sito non si apre dentro altri siti, ai link esterni arriva
# solo il dominio e non l'indirizzo completo, niente fotocamera, microfono
# o posizione. La mappa di Google è un iframe dentro le nostre pagine:
# queste regole non la toccano.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Le pagine sono statiche e cambiano a ogni pubblicazione: non vanno
# tenute in cache dal browser, altrimenti il cliente modifica un
# progetto e non vede la differenza.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le immagini nostre invece non cambiano mai: hanno un nome diverso quando
# sono diverse, quindi possono restare in cache a lungo. NON img/caricate:
# il pannello chiede le foto appena caricate prima che esistano sul sito, e
# Netlify mette questa intestazione anche sulla risposta «non trovata»: il
# browser se la ricordava per un anno e la foto restava rotta (20/11/2026).
# Le foto caricate restano con la regola di Netlify: si ricontrollano ogni volta.
[[headers]]
  for = "/img/progetti/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/sede/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/team/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/certificazioni/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/condivisione/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Il pannello di gestione non deve finire nei motori di ricerca.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
